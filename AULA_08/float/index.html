<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Float</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h2>Float</h2>
    <p>Serve para mudar a posição do elemento na tela, seguindo seu ancestral mais próximo</p>
    <ul>
        <li>Float: left; -> flutua para esquerda</li>
        <li>Float: rigth; -> flutua para direita</li>
        <li>Float: both; -> limpa os estilos anteriores</li>
    </ul>

    <br><br>

    <div>
        <h3>Float: left;</h3>
        <p class="esquerda">Um texto...</p>
        <img src="https://i.pinimg.com/736x/01/ea/08/01ea08a2ec4a17fe907e2e95bb1805ff.jpg"
    </div>

     <div>
        <h3>Float: rigth;</h3>
        <p class="direita">Um texto...</p>
        <img class="direita" src="https://i.pinimg.com/736x/01/ea/08/01ea08a2ec4a17fe907e2e95bb1805ff.jpg">
    </div>
    <p class="limpar">Um texto qualquer!</p>
</body>
</html>
