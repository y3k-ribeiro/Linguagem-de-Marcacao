<!DOCYTE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Links/Âncoras</title>
	</head>
	<body>
		<!-- Cabeçalho -->
		<header>
		<h1 style="text-align: center">Menu de Links</h1>
		<!-- a: tag de link -->
		<!-- href: link do site -->
		<a href="https://www.instagram.com/">Instagram</a>
			<br>
			
			<!-- target=" blank" abre em uma nova aba -->
			<a href="https://www.youtube.com/" target=" blank">YouTube</a>
			
			<br>
			
			<a href="../AULA_01/ex6.html">Exercícios HTML - Meu Site</a>
			
			<hr>
		</header>
		<main>
			<article>
				<h2>Links:</h2>
				<p>Posso colocar links onde eu quiser!</p>
				<p>
					Inclusive dentro de um parágrafo!
					<a href="https://www.google.com/">Clique aqui!</a>
				<p>
				<a href="https://www.w3schools.com/">
					<img src="https://www.w3schools.com/videos/files/images/w3schools_logo_500_04AA6D.png" width=20%>
				</a>
			</article>
			
		</main>
