<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exercício 1 - Tabela</title>
	</head>
	<body>
		<!-- table -> tabela-->
		<!--Iniciando a tabela-->
		<table border="1" width="100%">
			<!-- thead -> table head -> cabeçalho da tabela-->
			<h1 style="text-align: center; color: #000;">Exercício de lista HARD</h1>
			<thead style="background-color: gray; color: #000;">
				<!-- Criando a primeira linha -->
				<!-- linha da tabela -> table row -> tr-->
				<tr>
					<!-- th -> table head -> cabeçalho -->
					<th>Veículos</th>
					<th>Serviço</th>
					<th>Tempo Previsto</th>
					<th>Valor</th>
				</tr>
			</thead>
			<!-- tbody -> table body -> corpo da tabela-->
			<tbody>
				<!-- Criando a segunda linha -->
				<!-- linha da tabela -> table row -> tr -->
				<tr>
					<!-- td -> table data -> Dados da tabela  -->
					<td>Caminhonete S10</td>
					<td>Suspensão</td>
					<td>3 horas e 25 minutos</td>
					<td>350,00</td>
				</tr>
				<!-- Criando a terceira linha -->
				<!-- linha da tabela -> table row -> tr -->
				<tr> 
					<td>Caminhonete Ranger</td>
					<td>Freio</td>
					<td>3 horas e 45 minutos</td>
					<td>200,00</td>
				</tr>
				
				<!-- Criando a quarta linha -->
				<tr>
				<!-- COLSPAN -> mesclar colunas -->
					
				</tr>
				
				<!-- Criando a quinta linha -->
				<tr>
					<td>Caminhonete Hilux</td>
					<td>Troca de Bateria</td>
					<td>30 minutos</td>
					<td>25,00</td>
				</tr>
				
				<!-- Criando a sexta linha-->
				<tr>
					<td>Caminhonete D10</td>
					<td>Alinhamento</td>
					<td>1 horas e 40 minutos</td>
					<td>220,00</td>
				
			</tbody>
		</table>
	</body>
</html>
