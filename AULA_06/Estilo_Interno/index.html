<DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Estilo Interno</title>
		<style>
			p{
				color: blue;
				font-size: 34px;
				font-family: Arial;
			}
			p{
				color: red;
			}
			p{
				color: purple;
				text-align: center;
			}
			/* Chamando a classe -> usa-se . */
			.texto-verde{	
				color: green;
			
			}
			
			/* Chamando o id -> usa-se # */
			#texto-rosa{	
				color: pink;
			}
		</style>
	</head>
	<body>
		<p>Texto com estilo interno</p>
		<p class="texto-verde">Texto 2</p>
		<p id="texto-rosa">Texto 3</p>
	</body>
</html>
